# Site
title: Tianyu Blog
bio: "Minimal, one column jekyll theme."
description: "lol"
reading_time: true
words_per_minute: 200
logo: "assets/img/logo.png"
background: "assets/img/339a58fd-2a6c-4309-8e45-eac41c820c6f.png"
tiled_bg: true # Set this true if you want to tile your background image, otherwise it will be covered
locale: zh-cn
url: https://tianyu219.github.io

# Jekyll
permalink: /:title/
markdown: kramdown
highlighter: rouge
kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false
mathjax: true
sass:
  sass_dir: _sass
  style: compressed

# Comments

# Social
# if you don't have any of social below, comment the line.
#google:
# plus: username
#analytics:
#verify:
#ad-client:
#ad-slot:
#bing-verify:
#email:
twitter: tianyu_219
#facebook: username
github-url: tianyu219
#stackoverflow: 123456/username   from a "http://stackoverflow.com/users/123456/username" link
#linkedin: username
#xing: username
instagram: tianyu_219
#lastfm: username
#tumblr: username
#medium: '@username'
#pinterest: username
#foursquare: username
#steam: 
#dribbble: username
#youtube: username
#youtube-channel: channel
#soundcloud: username
#weibo: username
#flickr: username
#codepen: username
#keybase: username
#xmpp: username@server.com
#hackernews: username

# Plugins
plugins:
  - jekyll-mentions
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-include-cache

jekyll-mentions:
  base_url: https://github.com

# Exclude list
exclude:
  [
    README.md,
    Gemfile,
    Gemfile.lock,
    node_modules,
    gulpfile.js,
    package.json,
    _site,
    src,
    vendor,
    CNAME,
    LICENSE,
    Rakefile,
  ]
